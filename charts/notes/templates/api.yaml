apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-api}}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports: [{containerPort: 8000}]
          env:
            - {name: REDIS_URL, value: "redis://{{ .Release.Name }}-redis:6379/0"}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-secret, key: POSTGRES_PASSWORD}}}
            - {name: DATABASE_URL, value: "postgresql://notes:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/notes"}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-api}
spec: {selector: {app: {{ .Release.Name }}-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: v1
kind: Secret
metadata: {name: {{ .Release.Name }}-secret}
stringData: {POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}}
